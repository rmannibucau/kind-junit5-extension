name: Github CI

on: [push, pull_request]

env:
  MAVEN_OPTS: -Dmaven.repo.local=/home/runner/work/kind-junit-extension/kind-junit-extension/.m2 -Dmaven.artifact.threads=256 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

jobs:
  build:
    name: Main Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: s4u/setup-maven-action@v1.19.0
        with:
          checkout-fetch-depth: 0
          java-distribution: zulu
          java-version: 21
          maven-version: 4.0.0-rc-5
          cache-path: /home/runner/work/kind-junit-extension/kind-junit-extension/.m2
      - name: Build
        run: mvn install -Dm2.location=/home/runner/work/kind-junit-extension/kind-junit-extension/.m2
      - name: Remove Snapshots Before Caching
        run: find /home/runner/work/kind-junit-extension/kind-junit-extension/.m2 -name '*SNAPSHOT' | xargs rm -Rf
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: s4u/setup-maven-action@v1.19.0
        with:
          checkout-fetch-depth: 0
          java-distribution: zulu
          java-version: 21
          maven-version: 4.0.0-rc-5
          cache-path: /home/runner/work/kind-junit-extension/kind-junit-extension/.m2
      - name: Build
        run: mvn install -DskipTests ossindex:audit
      - name: Remove Snapshots Before Caching
        run: find /home/runner/work/kind-junit-extension/kind-junit-extension/.m2 -name '*SNAPSHOT' | xargs rm -Rf
